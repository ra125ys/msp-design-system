<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Button — preview</title>
<style>body{margin:0;padding:12px;background:var(--surface);font-family:var(--font-sans)}.wrap{width:366px}</style></head>
<body><div id="root" class="wrap msp"></div>
<script>
var M = window.MSP, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{display:'flex',flexDirection:'column',gap:10}},
 h('div',{style:{display:'flex',gap:8}},h(M.Button,{size:'lg',full:true},'Yes'),h(M.Button,{size:'lg',variant:'ghost',full:true},'No')),
 h('div',{style:{display:'flex',gap:8}},h(M.Button,{full:true},'Follow'),h(M.Button,{variant:'secondary',full:true},'Message')),
 h('div',null,h(M.Button,{size:'sm'},'Share'))));
</script></body></html>
