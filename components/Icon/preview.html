<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Icon — превью</title>
<style>body{margin:0;padding:12px;background:var(--surface);font-family:var(--font-sans)}.wrap{width:366px}</style></head>
<body><div id="root" class="wrap msp"></div>
<script>
var M = window.MSP, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{display:'flex',flexWrap:'wrap',gap:12,color:'var(--ink)'}},M.icons.map(function(n){return h('span',{key:n,title:n,style:{display:'inline-flex',flexDirection:'column',alignItems:'center',gap:4,width:44}},h(M.Icon,{name:n,size:24}),h('span',{style:{fontSize:9,color:'var(--muted)'}},n));})));
</script></body></html>
